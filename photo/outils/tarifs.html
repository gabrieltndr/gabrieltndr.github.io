<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarifs 2026 — Gabriel Tondeur</title>
<style>
@font-face{font-family:"Anton";src:url(../fonts/anton.woff) format("woff")}
@font-face{font-family:"Inter";src:url(../fonts/inter-400.woff) format("woff");font-weight:400}
@font-face{font-family:"Inter";src:url(../fonts/inter-500.woff) format("woff");font-weight:500}
@font-face{font-family:"Inter";src:url(../fonts/inter-600.woff) format("woff");font-weight:600 700}
@page{size:A4;margin:0}
:root{--bg:#0F0F0D;--panel:#181815;--line:rgba(240,236,226,.14);--txt:#EFEBE1;--mut:#9C988D;--acc:#D9F24A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,Arial,sans-serif;color:var(--txt);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;min-height:297mm;margin:0 auto;display:flex;flex-direction:column}
.h{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9}
.acc{color:var(--acc)}
header{padding:7mm 14mm 4mm;display:flex;justify-content:space-between;align-items:end;gap:8mm;border-bottom:1px solid var(--line)}
header .h{font-size:34pt}
header p{font-size:8.5pt;color:var(--mut);text-align:right;line-height:1.5}
main{padding:4mm 14mm;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;align-content:start}
.cond{grid-column:1/-1}
.opt{grid-column:1/-1}.og{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm}
.cat h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:12pt;color:var(--acc);margin-bottom:1.4mm}
.row{display:grid;grid-template-columns:1fr auto;gap:.8mm 4mm;padding:1.6mm 3.5mm;background:var(--panel);margin-bottom:1mm}
.row b{font-weight:600;font-size:9pt}
.row p{grid-column:1;font-size:7.3pt;color:var(--mut);line-height:1.4}
.row .pr{grid-row:1/3;grid-column:2;text-align:right;white-space:nowrap;align-self:center}
.row .pr strong{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:15pt;display:block;line-height:1}
.row .pr span{font-size:7pt;color:var(--mut)}
.cond{font-size:7.2pt;color:#D7D3C8;line-height:1.45;display:grid;gap:1mm;list-style:none;padding:3mm 4mm;border:1px solid var(--line)}
.cond li{padding-left:4mm;position:relative}
.cond li::before{content:"";position:absolute;left:0;top:1.5mm;width:1.8mm;height:1.8mm;background:var(--acc)}
footer{background:var(--acc);color:#111;padding:4mm 14mm;display:flex;justify-content:space-between;align-items:center;font-size:9pt;font-weight:600}
footer .h{font-size:14pt}
.print{position:fixed;right:16px;bottom:16px;background:var(--acc);color:#111;border:0;padding:12px 18px;font:600 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
@media print{.print{display:none}}
@media screen and (max-width:820px){.page{width:100%}header{flex-direction:column;align-items:start}header p{text-align:left}}
</style>
</head>
<body>
<div class="page">
  <header><h1 class="h">Tarifs <span class="acc">2026</span></h1>
    <p>Gabriel Tondeur · Photographe sport &amp; communication · Caen<br>Prix nets, TVA non applicable (art. 293 B du CGI)<br>Mise à jour : <span id="maj"></span></p></header>
  <main id="m"></main>
  <footer><span class="h">Gabriel Tondeur.</span><span>06 59 18 97 21 · gabrieltondeur14@gmail.com</span></footer>
</div>
<button class="print" onclick="window.print()">Imprimer / PDF</button>
<script src="tarifs.js"></script>
<script>
{
const T=window.TARIFS,esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=p=>(p%1?p.toFixed(2).replace('.',','):p)+' €';
document.getElementById('maj').textContent=T.maj;
const cats=[...new Set(T.prestations.map(p=>p.cat))];
const row=o=>`<div class="row"><b>${esc(o.nom)}</b><div class="pr"><strong>${o.pct?'+'+o.pct+' %':o.prix?esc(fmt(o.prix)):'Sur devis'}</strong><span>${o.prix&&o.unite?'par '+esc(o.unite):''}</span></div><p>${esc(o.detail)}</p></div>`;
document.getElementById('m').innerHTML=cats.map(c=>`<section class="cat"><h2>${esc(c)}</h2>${T.prestations.filter(p=>p.cat===c).map(row).join('')}</section>`).join('')+
 `<section class="cat opt"><h2>Options</h2><div class="og">${T.options.map(row).join('')}</div></section><ul class="cond">${T.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`;
}
</script>
</body>
</html>
